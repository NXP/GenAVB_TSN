scr.genavb:
  belong_to: set.middleware.genavb
  contents:
    Description: GenAVB/TSN protocol stack for NXP MPUs and MCUs processors
    Format: source code
    Location: middleware/gen_avb
    Name: gen_avb
    Origin: NXP (BSD-3-Clause)
    Version: 7.4.0
    license:
    - license.bsd-3
  section-type: scr
set.middleware.genavb:
  belong_to: set.middleware.genavb
  dependency:
    anyOf:
    - ip:
      - DriverType_ENET
    - ip:
      - DriverType_ENET_QOS
    - ip:
      - DriverType_NETC
    - device:
      - MIMXRT1052
      - MIMXRT1176
      - MIMXRT1189
      - MCXE31B
      - MCXE247
  section-type: set
  section_info:
    component_taxonomy:
      middleware_genavb:
        cclass: Network
        cgroup: GenAVB_TSN_stack
    description: genavb
    display_name: genavb
    fixed_id: nxp_genavb
    product:
      cmsis_pack:
        pack_root:
          pack_name: genavb
          pack_type: SWP
          pack_version: 1.0.0
        scr:
        - scr.genavb
        supported: true
        vendor: NXP
      kex_package:
        kex_web_ui:
          ui_category: Middleware
          ui_control: true
          ui_control_default: false
          ui_release_specific: true
        scr:
        - scr.genavb
    set_location:
      repo_base_path: middleware/genavb
    type: middleware
    vendor: NXP
    version: 7.4.0
